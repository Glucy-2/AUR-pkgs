name: Update AUR packages

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package base to process, or "all"'
        type: string
        default: all
      dry_run:
        description: 'Do not write to GitHub or AUR'
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - 'ddns-go-bin/**'
      - 'ecapture-bin/**'
      - 'ifrextractor-rs/**'
      - 'ifrextractor-rs-bin/**'
      - 'intel-mlc/**'
      - 'nali-nt/**'
      - 'nali-nt-bin/**'
      - 'nali-nt-git/**'
      - 'neo4j-community-bin/**'
      - 'opencl-vanity-gpg/**'
      - 'opencl-vanity-gpg-bin/**'
      - 'wakatime/**'
      - '.automation/packages.json'
      - 'scripts/**'
      - '.github/workflows/update.yaml'
  pull_request:
    paths:
      - 'ddns-go-bin/**'
      - 'ecapture-bin/**'
      - 'ifrextractor-rs/**'
      - 'ifrextractor-rs-bin/**'
      - 'intel-mlc/**'
      - 'nali-nt/**'
      - 'nali-nt-bin/**'
      - 'nali-nt-git/**'
      - 'neo4j-community-bin/**'
      - 'opencl-vanity-gpg/**'
      - 'opencl-vanity-gpg-bin/**'
      - 'wakatime/**'
      - '.automation/packages.json'
      - 'scripts/**'
      - '.github/workflows/update.yaml'

permissions:
  contents: read

concurrency:
  group: aur-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      packages: ${{ steps.matrix.outputs.packages }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false
      - id: matrix
        name: Compute package matrix
        env:
          INPUT_PACKAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.package || 'all' }}
        run: |
          set -euo pipefail
          packages=$(python3 scripts/aur_update.py matrix --package "$INPUT_PACKAGE" | jq -c .)
          echo "packages=${packages}" | tee -a "$GITHUB_OUTPUT"

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false
      - name: Run unit tests
        run: python3 -m unittest discover -s scripts/tests -v

  check:
    needs: matrix
    if: needs.matrix.outputs.packages != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        package: ${{ fromJson(needs.matrix.outputs.packages) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false
      - name: Install host tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libarchive-tools
          docker pull archlinux:base-devel
      - name: Check and build ${{ matrix.package }}
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/work/$PACKAGE" "$RUNNER_TEMP/results"
          python3 scripts/aur_update.py check --package "$PACKAGE" \
            --work-dir "$RUNNER_TEMP/work/$PACKAGE" \
            --result-dir "$RUNNER_TEMP/results"
      - name: Stage artifact
        if: always()
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/upload/results" "$RUNNER_TEMP/upload/logs"
          if [ -d "$RUNNER_TEMP/results/$PACKAGE" ]; then
            cp -a "$RUNNER_TEMP/results/$PACKAGE" "$RUNNER_TEMP/upload/results/"
          fi
          if [ -d "$RUNNER_TEMP/work/$PACKAGE/logs" ]; then
            cp -a "$RUNNER_TEMP/work/$PACKAGE/logs" "$RUNNER_TEMP/upload/logs/$PACKAGE"
          fi
      - name: Upload results and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-${{ matrix.package }}
          path: ${{ runner.temp }}/upload
          if-no-files-found: warn
          retention-days: 7

  publish:
    needs: [matrix, unit-tests, check]
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      needs.matrix.result == 'success' &&
      needs.unit-tests.result == 'success' &&
      needs.matrix.outputs.packages != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          submodules: false
          persist-credentials: false
      - name: Download results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: results-*
          merge-multiple: true
          path: ${{ runner.temp }}/artifacts
      - name: Install host tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libarchive-tools
          docker pull archlinux:base-devel
      - name: Publish (dry run)
        if: env.DRY_RUN == 'true'
        env:
          PACKAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.package || 'all' }}
        run: |
          set -euo pipefail
          python3 scripts/aur_update.py publish --dry-run \
            --package "$PACKAGE" \
            --results-dir "$RUNNER_TEMP/artifacts/results"
      - name: Publish
        if: env.DRY_RUN != 'true'
        env:
          AUR_GITHUB_SSH_KEY: ${{ secrets.AUR_GITHUB_SSH_KEY }}
          PACKAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.package || 'all' }}
        run: |
          set -euo pipefail
          if [ -z "${AUR_GITHUB_SSH_KEY:-}" ]; then
            echo "::error::secret AUR_GITHUB_SSH_KEY is not configured"
            exit 1
          fi
          umask 077
          key_file=$(mktemp "$RUNNER_TEMP/aur-key.XXXXXX")
          trap 'shred -u "$key_file" 2>/dev/null || rm -f "$key_file"' EXIT
          printf '%s\n' "$AUR_GITHUB_SSH_KEY" > "$key_file"
          chmod 0600 "$key_file"
          export AUR_SSH_KEY_FILE="$key_file"
          unset AUR_GITHUB_SSH_KEY
          python3 scripts/aur_update.py publish \
            --package "$PACKAGE" \
            --results-dir "$RUNNER_TEMP/artifacts/results"
